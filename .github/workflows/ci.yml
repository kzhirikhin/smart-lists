name: CI

# Feature-ветки проверяются по полному итоговому diff PR, а не по последнему
# push: иначе code commit с последующим docs commit мог бы получить быстрый
# статус на новом SHA. Push в main остаётся полным post-merge release gate.
# По умолчанию workflow ничего не деплоит и не трогает боевые ресурсы.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Пока release-job выключена, main ведёт себя как остальные ветки. После её
# явного включения уже начатую DDL нельзя прерывать новым push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' || vars.ENABLE_PRODUCTION_MIGRATION != 'true' }}

permissions:
  contents: read

jobs:
  # Классификатор работает fail-closed и использует полный merge-result PR.
  # До отдельного включения repository variable любой diff считается полным:
  # это позволяет сначала влить и сделать `gate` обязательным, не открывая окно
  # между кодом workflow и внешней настройкой ruleset.
  classify:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      reason: ${{ steps.classify.outputs.reason }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify complete change set
        id: classify
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_DOCS_FAST_PATH_ENABLED: ${{ vars.ENABLE_DOCS_ONLY_CI }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci-policy.mjs classify

  docs:
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.mode == 'docs'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate documentation diff
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: git diff --check "${CI_BASE_SHA}" "${CI_HEAD_SHA}" --

  # Быстрые project-specific security-контракты видны отдельно от обычных
  # unit-тестов. Пока набор намеренно дублируется в npm test: сначала gate
  # должен доказать стабильность, и только потом можно обсуждать оптимизацию.
  security-static:
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.mode == 'full'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts && npx prisma generate

      - name: Static security contracts
        run: npm run test:security:static

  checks:
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.mode == 'full'

    # Заведомо нерабочие значения. DATABASE_URL нужен импортируемому runtime-
    # коду, а Next при сборке подставляет NEXT_PUBLIC_* в бандл.
    # Реальные секреты сюда не попадают намеренно: сборка в БД не ходит, и
    # подключение по этому адресу в раннере невозможно.
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      AUTH_SECRET: ci-placeholder-not-a-real-secret
      NEXT_PUBLIC_PUSHER_KEY: ci-placeholder
      NEXT_PUBLIC_PUSHER_CLUSTER: ap1

    steps:
      # Полные SHA не позволяют владельцу action незаметно передвинуть тег.
      # Комментарий с версией оставлен для Dependabot и ручных обновлений.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # --ignore-scripts: install-хуки зависимостей — главный вектор supply
      # chain в npm. Они исполняются от самого факта установки, без единого
      # импорта, и именно так доставлялась полезная нагрузка в axios 1.14.1
      # (март 2026). Флаг гасит и наш собственный postinstall, поэтому
      # `prisma generate` вызывается явно — без него не соберутся типы.
      - name: Install dependencies
        run: npm ci --ignore-scripts && npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Идёт последним: дольше всех и повторно проверяет типы вместе с
      # сгенерированными типами маршрутов, которых нет на шаге typecheck.
      - name: Build
        run: npm run build

  # Интеграционные тесты Server Actions против настоящего PostgreSQL. Отдельной
  # job — чтобы лёгкие проверки выше не ждали поднятия базы и было видно, что
  # именно упало. Здесь применяется `prisma migrate deploy`, но только к
  # эфемерной базе service-контейнера, а не к боевой.
  integration:
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.mode == 'full'

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smartlists_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smartlists_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      # Имя базы содержит "test" — проходит защиту global-setup от прогона
      # против не-тестовой базы.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/smartlists_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5433/smartlists_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # Без install-хуков зависимостей — см. комментарий в job `checks`.
      - name: Install dependencies
        run: npm ci --ignore-scripts && npx prisma generate

      - name: Integration tests under separated database roles
        run: npm run test:integration:roles

  # E2E: настоящий браузер против собранного приложения и отдельной базы.
  # Своя job, потому что дольше остальных и требует загрузки Chromium. База —
  # тоже эфемерный service-контейнер; боевые ресурсы не затрагиваются.
  e2e:
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.mode == 'full'

    # Здоровый прогон укладывается в 3 минуты. Потолок нужен не ради экономии,
    # а чтобы зависший шаг падал сам: без него job ждёт отмены руками, а
    # production migration ждёт его через `needs` и не получает отказа.
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smartlists_e2e_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smartlists_e2e_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      # Остальное окружение приложения задаёт playwright.config.ts (test/e2e/env.ts):
      # он же поднимает сборку и сервер. Имя базы содержит "test" — проходит
      # защиту global-setup от прогона против не-тестовой базы.
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5434/smartlists_e2e_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5434/smartlists_e2e_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5434/smartlists_e2e_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # Без install-хуков зависимостей — см. комментарий в job `checks`.
      - name: Install dependencies
        run: npm ci --ignore-scripts && npx prisma generate

      # `--with-deps` объединяет два разных по надёжности действия: загрузку
      # браузера с CDN Playwright и установку системных пакетов через apt.
      # Зеркало Ubuntu в раннере периодически не отвечает, и тогда apt висит
      # молча — 2026-08-19 так были потеряны два прогона подряд. Поэтому шаги
      # разделены, и сеть apt больше не решает судьбу e2e.
      #
      # На образе ubuntu-24.04 из `--with-deps` реально доставляются только
      # девять шрифтовых пакетов (`fonts-*`, `xfonts-*`): все библиотеки,
      # нужные самому Chromium, в образе уже стоят. Скриншотных сравнений в
      # E2E нет, тексты читаются из DOM, поэтому недостающий шрифт результат
      # не меняет — шаг сделан необязательным осознанно.
      #
      # Потолок держим низким: здоровая установка занимает около 15 секунд, а
      # в первом же прогоне после разделения apt снова завис — уже не на
      # `update`, а на загрузке самих пакетов — и прогон впустую ждал полные
      # пять минут. Две минуты — всё ещё восьмикратный запас к норме.
      - name: Install browser system dependencies
        continue-on-error: true
        timeout-minutes: 2
        run: npx playwright install-deps chromium

      # Только Chromium: остальные браузеры проект не поддерживает отдельно,
      # а каждый добавляет минуты к прогону.
      - name: Install Chromium
        run: npx playwright install chromium

      - name: E2E tests
        run: npm run test:e2e

      # Отчёт со скриншотами, видео и трассировками — единственный способ
      # разобрать падение, которое не воспроизводится локально.
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Секреты в истории. Дублирует push protection GitHub, но с другой стороны:
  # тот знает шаблоны известных провайдеров, а gitleaks ловит и generic-строки
  # вроде приватных ключей и строк подключения. Репозиторий публичный, поэтому
  # проверка нужна и на PR со стороны.
  secrets:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Вся история, а не последний коммит: секрет, добавленный и удалённый
          # внутри одного PR, остаётся в промежуточных коммитах.
          fetch-depth: 0

      # Бинарь официального релиза вместо стороннего action: в job попадает
      # только то, что мы явно назвали версией.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          # SHA-256 из официального gitleaks_8.30.1_checksums.txt.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          ARCHIVE_PATH="${RUNNER_TEMP}/${ARCHIVE}"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVE}" \
            --output "${ARCHIVE_PATH}"
          echo "${GITLEAKS_SHA256}  ${ARCHIVE_PATH}" | sha256sum --check -
          sudo tar -xzf "${ARCHIVE_PATH}" -C /usr/local/bin gitleaks

      # --redact: найденное значение не печатается в лог, который публичен.
      - name: Scan history
        run: gitleaks git --redact --verbose .

  # SCA на границе PR: Dependabot сообщает об уже известных проблемах,
  # а этот gate не даёт добавить новую high/critical уязвимость незаметно.
  # Action использует dependency graph API и не выполняет код PR.
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          # Обязательства copyleft срабатывают на распространении, а мы ничего
          # не распространяем: приложение хостится, пользователь получает HTML.
          # Поэтому список неоднороден по смыслу, и это стоит назвать вслух.
          #
          # AGPL-3.0 и SSPL-1.0 применимы к нам уже сегодня: у обеих есть
          # сетевая оговорка, покрывающая доступ пользователей через сеть.
          # GPL-2.0/3.0 добавлены профилактически — сейчас они ни к чему не
          # обязывают и ложных срабатываний не дают (таких зависимостей в дереве
          # нет), но станут проблемой в тот же день, когда появится
          # распространяемый артефакт.
          #
          # LGPL сознательно НЕ в списке. Под ней идут 13 пакетов
          # `@img/sharp-libvips-*` — предсобранный libvips, который тянет Next
          # для оптимизации изображений. Сетевой оговорки у LGPL нет, при
          # хостинге она не обязывает ни к чему, а запрет потребовал бы
          # исключений на 17 пакетов и ронял бы каждый бамп `next`. Гейт,
          # срабатывающий на невозможном сценарии, учат обходить не глядя.
          # Настоящий триггер здесь архитектурный и живёт в THREAT_MODEL.md.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, SSPL-1.0
          comment-summary-in-pr: never

  # Единственная агрегирующая точка принимает skipped тяжёлые job только после
  # fail-closed docs-классификации. `always()` не даёт GitHub автоматически
  # пропустить required gate после падения или skip одной из зависимостей.
  gate:
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - classify
      - docs
      - security-static
      - checks
      - integration
      - e2e
      - secrets
      - dependency-review

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify aggregate CI result
        env:
          CI_MODE: ${{ needs.classify.outputs.mode }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_CLASSIFY_RESULT: ${{ needs.classify.result }}
          CI_DOCS_RESULT: ${{ needs.docs.result }}
          CI_SECURITY_STATIC_RESULT: ${{ needs['security-static'].result }}
          CI_CHECKS_RESULT: ${{ needs.checks.result }}
          CI_INTEGRATION_RESULT: ${{ needs.integration.result }}
          CI_E2E_RESULT: ${{ needs.e2e.result }}
          CI_SECRETS_RESULT: ${{ needs.secrets.result }}
          CI_DEPENDENCY_REVIEW_RESULT: ${{ needs['dependency-review'].result }}
        run: node scripts/ci-policy.mjs gate

  # Release-job включается только явной repository variable. Она встроена в
  # этот workflow: первый main-прогон показал, что Environment secrets внутри
  # reusable workflow пришли пустыми. Здесь environment и потребляющие секреты
  # шаги находятся в одной job и одной границе доступа.
  production-migration:
    name: Production database migration
    runs-on: ubuntu-latest
    # gate допускает штатный skip docs/dependency-review на push. Неявный
    # success() распространяет этот skip на миграции через всю цепочку needs.
    # Явная status-функция снимает его; каждый обязательный результат ниже
    # всё равно должен быть успешным, а отменённый workflow не начинает DDL.
    if: >-
      !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_PRODUCTION_MIGRATION == 'true' &&
      needs['security-static'].result == 'success' &&
      needs.checks.result == 'success' &&
      needs.integration.result == 'success' &&
      needs.e2e.result == 'success' &&
      needs.secrets.result == 'success' &&
      needs.gate.result == 'success'
    needs: [security-static, checks, integration, e2e, secrets, gate]
    permissions:
      contents: read
    environment: Production

    # Два main-прогона не применяют миграции одновременно. Уже начатую
    # миграцию нельзя отменять новым push: не каждая будущая DDL будет
    # транзакционной.
    concurrency:
      group: production-database-release
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # Без install-хуков зависимостей — см. комментарий в job `checks`.
      # DIRECT_URL намеренно появляется только в guard и migration steps ниже,
      # поэтому установка зависимостей идёт без доступа к боевой БД.
      - name: Install dependencies
        run: npm ci --ignore-scripts && npx prisma generate

      - name: Verify database target
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          EXPECTED_DATABASE_HOST: ${{ secrets.EXPECTED_DATABASE_HOST }}
        run: node scripts/verify-release-database.mjs

      - name: Apply production migrations
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npm run migrate:deploy
