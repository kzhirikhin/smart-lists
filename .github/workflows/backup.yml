name: Database Backup

on:
  schedule:
    # 15:00 UTC = 00:00 следующего дня в Токио (JST = UTC+9, перехода на летнее
    # время в Японии нет, поэтому смещение постоянное). GitHub исполняет
    # расписание с задержкой до полутора часов — точное время не гарантировано.
    - cron: '0 15 * * *'
  workflow_dispatch:       # эта строка позволяет запустить вручную

# id-token нужен для OIDC-обмена с AWS; доступ к самому репозиторию не требуется,
# потому что checkout здесь не выполняется.
permissions:
  id-token: write

jobs:
  backup:
    runs-on: ubuntu-latest
    # Environment ограничивает место использования credential: секрет доступен
    # только job, объявившей его, и только с ветки `main` по branch policy. До
    # этого строка подключения роли бэкапа была repository-секретом, то есть
    # читалась любым workflow с любой ветки. Регистр имени существенен: он
    # входит в OIDC-claim `sub`, на который смотрит trust policy роли AWS.
    environment: Backup

    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get install -y wget gnupg
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      # Строку подключения нельзя ни прочитать, ни провести через ревью: она
      # живёт в secret. Здесь клиент — настоящий libpq, для которого `require`
      # означает «шифровать, не проверяя, с кем говоришь», а `PGSSLROOTCERT`
      # ниже действует только в режимах `verify-ca` и `verify-full`. Поэтому
      # режим проверяется до того, как дамп со всем содержимым БД уйдёт по
      # непроверенному каналу. Checkout здесь намеренно не делается, поэтому
      # общий `scripts/verify-release-database.mjs` недоступен и guard остаётся
      # встроенным. Секрет читается через `env`, а не подставляется в тело
      # скрипта: подстановка сделала бы его значение частью команды.
      - name: Verify SSL mode
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          case "$DIRECT_URL" in
            *"sslmode=verify-full"*) echo "sslmode=verify-full" ;;
            *) echo "::error::DIRECT_URL должен использовать sslmode=verify-full"; exit 1 ;;
          esac

      - name: Run pg_dump
        env:
          # Сохраняем verify-full и используем доверенные корневые CA раннера.
          PGSSLROOTCERT: system
        run: |
          /usr/lib/postgresql/17/bin/pg_dump \
            --no-privileges \
            --no-owner \
            -Fc \
            -d "${{ secrets.DIRECT_URL }}" \
            -f backup.dump

      - name: Verify dump
        run: |
          # Битый или обрезанный дамп обнаруживается только при восстановлении,
          # когда он уже нужен. Читаем оглавление сразу: это ловит порчу архива.
          /usr/lib/postgresql/17/bin/pg_restore --list backup.dump > /dev/null
          echo "dump size: $(stat -c%s backup.dump) bytes"

      # OIDC вместо долгоживущих ключей: GitHub подписывает токен, AWS меняет его
      # на временные креды. Роль доверяет только ветке main этого репозитория,
      # поэтому форки и pull request'ы получить их не могут.
      - name: Configure AWS credentials
        # Пин по SHA, а не по тегу: тег можно передвинуть на другой коммит, и job
        # с правом получить AWS-креды выполнил бы чужой код. Обновлять вручную.
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.BACKUP_AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      # Дамп содержит email пользователей, OAuth-токены и всё содержимое списков,
      # поэтому уходит только в приватный бакет. Артефакты Actions для этого не
      # годятся: в публичном репозитории их может скачать любой желающий.
      - name: Upload to S3
        run: |
          # Имя по токийской дате: запуск в 15:00 UTC относится уже к следующим
          # суткам JST, и по UTC-дате файлы отставали бы на день от расписания.
          KEY="backups/smart-lists-$(TZ=Asia/Tokyo date +%Y-%m-%d).dump"
          aws s3 cp backup.dump "s3://${{ secrets.BACKUP_S3_BUCKET }}/${KEY}" --no-progress
