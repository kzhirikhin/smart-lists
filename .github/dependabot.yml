# Обновления версий. Security-обновления включены отдельно, на уровне
# репозитория, и этим файлом не управляются — им cooldown не применяется, и это
# правильно: известная уязвимость должна чиниться сразу.
#
# Смысл cooldown. Быстрое обновление снижает риск словить известную
# уязвимость, но повышает риск принять вредоносный релиз. Риски несимметричны
# во времени: исправление в версии остаётся навсегда и подождёт неделю без
# потерь, а скомпрометированный релиз живёт часы — в марте 2026 вредоносные
# axios 1.14.1 и 0.30.4 продержались в реестре около трёх часов. Выдержка почти
# ничего не стоит в первом случае и снимает большую часть второго.
#
# Автомерж не включаем нигде. Зелёный CI не ловит закладку: тесты проверяют,
# что приложение работает, а вредонос на это и рассчитывает.
version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

    cooldown:
      default-days: 7

    # Группировка обязательна: без неё один только @aws-sdk/* завалит
    # репозиторий PR-ами — там три пакета и релизы почти ежедневные.
    # Пакет попадает в первую подходящую группу, поэтому порядок значим.
    groups:
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
        exclude-patterns:
          - "@aws-sdk/*"

    # Мажоры делаются руками, по одному, со своим ревью: они меняют API и
    # ломают сборку, а в общем потоке превратились бы в постоянно красный PR,
    # который перестают читать. Этот комментарий — единственное место, где
    # очередь записана, поэтому закрытый мажор убирается отсюда той же задачей.
    #
    # Очередь готовых к работе пуста. Два мажора ждут чужого релиза, и у
    # каждого своя issue с триггером возврата и критериями готовности:
    #   - eslint 9 -> 10 (#96): eslint-config-next тянет eslint-plugin-import,
    #     eslint-plugin-react и eslint-plugin-jsx-a11y, а те не объявляют
    #     ESLint 10 в peer-диапазоне;
    #   - typescript 6 -> 7 (#97): typescript-eslint держит peer <6.1.0.
    # Обход обоих существует — ослабить peer-проверку при установке, — но он
    # ломает воспроизводимость npm ci, ради которой lock собирается в
    # контейнере. Поэтому ждём, а не обходим.
    #
    # @types/node держим на мажоре рантайма, а не на последнем опубликованном.
    # Vercel предлагает максимум 24.x, столько же закреплено в CI. Типы 26
    # описывают API, которых в проде нет: typecheck стал бы зелёным на том,
    # что упадёт при запуске. Поэтому 26 берём не раньше, чем 26.x появится в
    # настройках проекта на Vercel.
    #
    # Закрыты 08-20: @types/node 20 -> 24 (#94), lucide-react 0.x -> 1.x (#95).
    # Закрыт 08-21: framer-motion 12 -> 13.
    # Локально обновлены 11-11: OIDC 3 -> 4, dotenv 17 -> 18, Motion 13 -> 14.
    # minimatch @10 в typescript-eslint ждёт совместимого upstream-обновления;
    # override на @11 намеренно не используется. План: docs/dependency-updates-2026-11.md.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # Actions — та же поверхность: скомпрометированный action исполняется в CI с
  # правами workflow. Пины стоят по полному SHA, Dependabot умеет их двигать
  # вместе с комментарием версии.
  #
  # Мажоры здесь намеренно НЕ исключены, в отличие от npm выше, и это не
  # недосмотр. Причина исключения там — объём: в дереве из 906 пакетов мажоры
  # идут потоком и в общей ленте стали бы вечно красными PR. Экшенов пять, и
  # мажор у каждого раз в год. Решает же асимметрия видимости: пропущенный
  # npm-мажор находится одной командой `npm outdated`, а для закреплённых по
  # SHA экшенов такой команды нет — Dependabot единственный источник знания о
  # новых версиях. Исключив мажоры здесь, мы сделали бы их не отложенными, а
  # невидимыми. Правило «мажор не вливается сам и требует решения человека»
  # при этом соблюдается везде: автомержа нет нигде.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
