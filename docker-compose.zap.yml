# Порты не публикуются; скан и приложение не видят внешнюю сеть/credentials хоста.
services:
  postgres:
    image: postgres:17@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartlists_zap_test
    tmpfs: ["/var/lib/postgresql/data"]
    networks: [isolated]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "smartlists_zap_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  pilot:
    build:
      context: .
      dockerfile: docker/zap/Dockerfile
    image: smart-lists-zap-pilot:local
    # Общий loopback сохраняет TLS-guard приложения: только localhost считается
    # одноразовой БД без verify-full. Сам guard ради пилота не ослабляется.
    network_mode: service:postgres
    environment:
      ZAP_PILOT: "1"
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartlists_zap_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartlists_zap_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/smartlists_zap_test
    depends_on:
      postgres: { condition: service_healthy }
  zap:
    image: ghcr.io/zaproxy/zaproxy@sha256:7aaa659b0d43078febd82e29bad112285c370727e86ab8340444220e17d9f0d2
    # Общий namespace нужен для localhost из неизменённых E2E fixtures.
    network_mode: service:postgres
    depends_on: [pilot]
    # Silent запрещает unsolicited update/telemetry: version rule иначе ждёт
    # недоступный update endpoint на каждом сообщении изолированного скана.
    command: ["zap.sh", "-daemon", "-silent", "-host", "127.0.0.1", "-port", "8090", "-config", "api.disablekey=true", "-config", "api.addrs.addr.name=127.0.0.1", "-config", "api.addrs.addr.regex=false", "-config", "autoupdate.checkOnStart=false"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/JSON/core/view/version/',timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 60
networks:
  isolated:
    internal: true
